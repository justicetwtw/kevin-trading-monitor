name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt
      - name: Verify agent workflow contract
        run: python scripts/verify_agent_workflow_contract.py
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest.log 2>&1
          status=$?
          tail -n 180 pytest.log
          exit $status
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest.log
          if-no-files-found: error
          retention-days: 7

  trump-source-probe:
    # Mocked tests are not proof that a current source is reachable from a runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install minimal project dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt
      - name: Probe current Trump source without post content
        run: python -m src.runners.run_trump_source_probe
      - name: Upload source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trump-source-probe
          path: trump_source_probe.json
          if-no-files-found: error
          retention-days: 7
