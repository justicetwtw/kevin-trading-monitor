name: Market Brief

on:
  schedule:
    # us_eod 美股盤後
    - cron: '30 0 * * 2-6'   # 主 (台北週二~週六 08:30)
    - cron: '0 1 * * 2-6'    # 備 (台北 09:00)

    # tw_eod 台股盤後
    - cron: '30 5 * * 1-5'   # 主 (台北 13:30)
    - cron: '0 6 * * 1-5'    # 備 (台北 14:00)

    # us_premarket 美股盤前
    - cron: '0 13 * * 1-5'   # 主 (台北 21:00)
    - cron: '30 13 * * 1-5'  # 備 (台北 21:30)

    # us_midday 美股盤中
    - cron: '0 22 * * 2-6'   # 主 (台北 06:00)
    - cron: '30 22 * * 2-6'  # 備 (台北 06:30)
  workflow_dispatch:
    inputs:
      brief_type:
        description: 'Brief type for manual run'
        required: true
        default: 'us_eod'
        type: choice
        options:
          - us_eod
          - tw_eod
          - us_premarket
          - us_midday

concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Determine BRIEF_TYPE from cron / dispatch
        id: brief_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "brief_type=${{ github.event.inputs.brief_type }}" >> $GITHUB_OUTPUT
          else
            SCHEDULE="${{ github.event.schedule }}"
            case "$SCHEDULE" in
              "30 0 * * 2-6"|"0 1 * * 2-6")
                echo "brief_type=us_eod" >> $GITHUB_OUTPUT
                ;;
              "30 5 * * 1-5"|"0 6 * * 1-5")
                echo "brief_type=tw_eod" >> $GITHUB_OUTPUT
                ;;
              "0 13 * * 1-5"|"30 13 * * 1-5")
                echo "brief_type=us_premarket" >> $GITHUB_OUTPUT
                ;;
              "0 22 * * 2-6"|"30 22 * * 2-6")
                echo "brief_type=us_midday" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "Unknown schedule: $SCHEDULE, fallback us_eod"
                echo "brief_type=us_eod" >> $GITHUB_OUTPUT
                ;;
            esac
          fi
      - name: Run market brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRIEF_TYPE: ${{ steps.brief_type.outputs.brief_type }}
        run: python -m src.runners.run_market_brief
      - if: always()
        uses: ./.github/actions/commit-state
