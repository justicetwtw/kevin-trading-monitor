name: Market Brief

on:
  schedule:
    - cron: '30 0 * * 2-6'   # us_eod       台北 08:30 (週二到週六)
    - cron: '30 5 * * 1-5'   # tw_eod       台北 13:30 (週一到週五)
    - cron: '0 13 * * 1-5'   # us_premarket 台北 21:00 (週一到週五)
    - cron: '0 22 * * 2-6'   # us_midday    台北 06:00 (週二到週六,起床看)
  workflow_dispatch:
    inputs:
      brief_type:
        description: 'Brief type for manual run'
        required: true
        default: 'us_eod'
        type: choice
        options:
          - us_eod
          - tw_eod
          - us_premarket
          - us_midday

concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Determine BRIEF_TYPE from cron / dispatch
        id: brief_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "brief_type=${{ github.event.inputs.brief_type }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            if [ "$HOUR" = "00" ] && [ "$MIN" -ge "25" ] && [ "$MIN" -le "35" ]; then
              echo "brief_type=us_eod" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "05" ] && [ "$MIN" -ge "25" ] && [ "$MIN" -le "35" ]; then
              echo "brief_type=tw_eod" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "13" ] && [ "$MIN" -lt "10" ]; then
              echo "brief_type=us_premarket" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "22" ] && [ "$MIN" -lt "10" ]; then
              echo "brief_type=us_midday" >> $GITHUB_OUTPUT
            else
              echo "brief_type=us_eod" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Run market brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRIEF_TYPE: ${{ steps.brief_type.outputs.brief_type }}
        run: python -m src.runners.run_market_brief
      - if: always()
        uses: ./.github/actions/commit-state
