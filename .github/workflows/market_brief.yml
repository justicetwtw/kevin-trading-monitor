name: Market Brief

on:
  schedule:
    # GitHub cron is UTC. All comments below are canonical Asia/Taipei times.
    # U.S. regular session:
    #   daylight time 21:30-04:00 next day
    #   standard time 22:30-05:00 next day

    # ===== U.S. daylight time =====
    # us_eod: 30/60 minutes after the 04:00 Taipei close
    - cron: '30 20 * * 1-5'   # Taipei 04:30 next day
    - cron: '0 21 * * 1-5'    # backup: Taipei 05:00 next day
    # us_premarket observation (not the opening bell)
    - cron: '0 9 * * 1-5'     # Taipei 17:00
    - cron: '30 9 * * 1-5'    # backup: Taipei 17:30
    # us_open: exact 09:30 ET core opening / Taipei 21:30
    - cron: '30 13 * * 1-5'   # Taipei 21:30
    - cron: '0 14 * * 1-5'    # backup: Taipei 22:00
    # us_midday: 13:00 ET / Taipei 01:00 next day
    - cron: '0 17 * * 1-5'    # Taipei 01:00 next day
    - cron: '30 17 * * 1-5'   # backup: Taipei 01:30 next day

    # ===== U.S. standard time =====
    # us_eod: 30/60 minutes after the 05:00 Taipei close
    - cron: '30 21 * * 1-5'   # Taipei 05:30 next day
    - cron: '0 22 * * 1-5'    # backup: Taipei 06:00 next day
    - cron: '0 10 * * 1-5'    # us_premarket: Taipei 18:00
    - cron: '30 10 * * 1-5'   # backup: Taipei 18:30
    - cron: '30 14 * * 1-5'   # us_open: Taipei 22:30
    - cron: '0 15 * * 1-5'    # backup: Taipei 23:00
    - cron: '0 18 * * 1-5'    # us_midday: Taipei 02:00 next day
    - cron: '30 18 * * 1-5'   # backup: Taipei 02:30 next day

    # ===== Taiwan fixed local times =====
    # 08:30 is pre-open order entry, NOT the 09:00 opening bell.
    - cron: '30 0 * * 1-5'    # tw_open identifier: Taipei 08:30 pre-open brief
    # TWSE/TPEx regular close is 13:30; allow final daily data to settle.
    - cron: '40 5 * * 1-5'    # tw_close: Taipei 13:40
    - cron: '0 6 * * 1-5'     # backup: Taipei 14:00

  workflow_dispatch:
    inputs:
      brief_type:
        description: 'Brief type for manual run'
        required: true
        default: 'us_eod'
        type: choice
        options:
          - us_eod
          - tw_open
          - tw_close
          - us_premarket
          - us_open
          - us_midday

concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Determine brief type and U.S. DST gate
        id: brief_type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "brief_type=${{ github.event.inputs.brief_type }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SCHEDULE="${{ github.event.schedule }}"
          IS_DST=$(python -c "from src.config.market_clock import is_us_dst_active; print('true' if is_us_dst_active() else 'false')")
          BT=""
          REQUIRES_DST=""

          case "$SCHEDULE" in
            # U.S. EOD
            "30 20 * * 1-5"|"0 21 * * 1-5") BT="us_eod"; REQUIRES_DST="true" ;;
            "30 21 * * 1-5"|"0 22 * * 1-5") BT="us_eod"; REQUIRES_DST="false" ;;
            # U.S. premarket observation
            "0 9 * * 1-5"|"30 9 * * 1-5") BT="us_premarket"; REQUIRES_DST="true" ;;
            "0 10 * * 1-5"|"30 10 * * 1-5") BT="us_premarket"; REQUIRES_DST="false" ;;
            # U.S. exact core open
            "30 13 * * 1-5"|"0 14 * * 1-5") BT="us_open"; REQUIRES_DST="true" ;;
            "30 14 * * 1-5"|"0 15 * * 1-5") BT="us_open"; REQUIRES_DST="false" ;;
            # U.S. midday
            "0 17 * * 1-5"|"30 17 * * 1-5") BT="us_midday"; REQUIRES_DST="true" ;;
            "0 18 * * 1-5"|"30 18 * * 1-5") BT="us_midday"; REQUIRES_DST="false" ;;
            # Taiwan; no DST gate
            "30 0 * * 1-5") BT="tw_open"; REQUIRES_DST="any" ;;
            "40 5 * * 1-5"|"0 6 * * 1-5") BT="tw_close"; REQUIRES_DST="any" ;;
            *)
              echo "Unknown schedule: $SCHEDULE -> skip"
              echo "brief_type=us_eod" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "brief_type=$BT" >> "$GITHUB_OUTPUT"
          if [ "$REQUIRES_DST" = "any" ] || [ "$REQUIRES_DST" = "$IS_DST" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "DST mismatch: requires=$REQUIRES_DST current=$IS_DST -> skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run market brief
        if: steps.brief_type.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BRIEF_TYPE: ${{ steps.brief_type.outputs.brief_type }}
        run: python -m src.runners.run_market_brief
      - if: always()
        uses: ./.github/actions/commit-state
