name: Dashboard Build

# Build a public-safe static Mission Control dashboard from committed state.
# Exact positions/account values are never included in public/dashboard/.

on:
  schedule:
    # Run after US EOD and Taiwan close state commits.
    - cron: '30 23 * * 1-5'
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      commit_output:
        description: 'Commit output to public/dashboard/ (false = artifact only)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build dashboard
        run: python -m src.runners.run_dashboard_build
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: public/dashboard/
          retention-days: 14
      - name: Configure GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/dashboard/
      - name: Commit dashboard output
        if: github.event_name == 'schedule' || github.event.inputs.commit_output == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dashboard/ || true
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit"
            exit 0
          fi
          git commit -m "dashboard: ${{ github.workflow }} [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retry in $((i*2))s..."
            sleep $((i*2))
          done
          echo "Push failed after 3 attempts"
          exit 1

  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
