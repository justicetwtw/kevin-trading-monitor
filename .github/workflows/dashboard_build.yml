name: Dashboard Build

# 靜態 dashboard 產生:讀既有 data_store/ state(由其他 scheduled workflow 維護),
# 產出 public/dashboard/{index.html, data/*.json}。
# 不打外部 API、不需要任何 secret、不影響 Telegram 推播。

on:
  schedule:
    # 在 us_eod / tw_close 的 state commit 之後跑,涵蓋夏令與冬令
    - cron: '30 23 * * 1-5'   # 台北 07:30(美股收盤後,state 已更新)
    - cron: '30 6 * * 1-5'    # 台北 14:30(台股收盤後)
  workflow_dispatch:
    inputs:
      commit_output:
        description: 'Commit output to public/dashboard/ (false = artifact only)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build dashboard
        run: python -m src.runners.run_dashboard_build
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: public/dashboard/
          retention-days: 14
      - name: Commit dashboard output
        if: github.event_name == 'schedule' || github.event.inputs.commit_output == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/dashboard/ || true
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit"
            exit 0
          fi
          git commit -m "dashboard: ${{ github.workflow }} [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, retry in $((i*2))s..."
            sleep $((i*2))
          done
          echo "Push failed after 3 attempts"
          exit 1
