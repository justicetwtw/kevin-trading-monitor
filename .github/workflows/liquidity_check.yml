name: ETF Liquidity Monthly Check

on:
  schedule:
    # 每月 1 號 22:00 UTC = 美東 17:00 EST / 18:00 EDT
    - cron: '0 22 1 * *'
  workflow_dispatch:

concurrency:
  group: liquidity-check
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run liquidity check
        run: python -m src.runners.run_liquidity_check
      - if: always()
        uses: ./.github/actions/commit-state
