name: Brief Sanity Check

on:
  schedule:
    # Taipei 23:45 / 23:55. This is after the U.S. standard-time opening
    # brief (22:30 primary, 23:00 backup), avoiding a false missing alert.
    - cron: '45 15 * * *'
    - cron: '55 15 * * *'
  workflow_dispatch:

concurrency:
  group: brief-sanity
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run brief sanity check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.runners.run_brief_sanity
