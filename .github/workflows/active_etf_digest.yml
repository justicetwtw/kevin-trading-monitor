name: Active ETF Consensus Digest

on:
  schedule:
    # 台股盤後、主動 ETF 每日持股公告後(NAV 結算後)。10:00 UTC = 18:00 台北,平日。
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: active-etf-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run active ETF consensus digest
        env:
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
        run: python -m src.runners.run_active_etf_digest
      - if: always()
        uses: ./.github/actions/commit-state   # 持久化每日持股快照(pull --rebase 防 push race)
