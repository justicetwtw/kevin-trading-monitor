name: IV History Update

on:
  schedule:
    # 工作日 22:00 UTC = 美東 17:00 (EST) / 18:00 (EDT),收盤後 1 小時
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: iv-history-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run IV history update
        run: python -m src.runners.run_iv_history_update
      - if: always()
        uses: ./.github/actions/commit-state
