name: Trump Truth Social Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# A slow/retrying source check must not create overlapping five-minute runs.
concurrency:
  group: trump-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Capture and deliver every new Trump activity
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.runners.run_trump_monitor
      - name: Commit archive and explicit source health
        if: always()
        uses: ./.github/actions/commit-state
