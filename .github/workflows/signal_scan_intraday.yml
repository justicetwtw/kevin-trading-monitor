name: Signal Scan Intraday

on:
  schedule:
    # NYSE/Nasdaq core session 09:30-16:00 ET equals:
    #   daylight time: 13:30-20:00 UTC / Taipei 21:30-04:00 next day
    #   standard time: 14:30-21:00 UTC / Taipei 22:30-05:00 next day
    # Cron intentionally covers a wider UTC window; the runner uses
    # is_us_market_hours() as the authoritative 09:30-16:00 ET gate.
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: signal-scan-intraday
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run intraday scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.runners.run_signal_scan_intraday
      - if: always()
        uses: ./.github/actions/commit-state
