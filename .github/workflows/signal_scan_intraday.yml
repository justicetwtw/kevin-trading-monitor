name: Signal Scan Intraday

on:
  schedule:
    # 美股交易時段 14:30 - 21:00 UTC (夏令) / 15:30 - 22:00 UTC (冬令)
    # 為簡化,涵蓋 13:00 - 22:00 UTC,每 15 分鐘
    # runner 內透過 is_us_market_hours 二次過濾(避免跑非交易時段)
    - cron: '*/15 13-22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: signal-scan-intraday
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run intraday scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.runners.run_signal_scan_intraday
      - if: always()
        uses: ./.github/actions/commit-state
