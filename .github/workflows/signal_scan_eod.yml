name: Signal Scan EOD

on:
  schedule:
    # NYSE/Nasdaq core close is 16:00 ET:
    #   U.S. daylight time = Taipei 04:00 next day
    #   U.S. standard time = Taipei 05:00 next day
    # Run 15 minutes after close and gate by current U.S. DST state.
    - cron: '15 20 * * 1-5'  # daylight: Taipei 04:15 next day
    - cron: '15 21 * * 1-5'  # standard: Taipei 05:15 next day
  workflow_dispatch:

concurrency:
  group: signal-scan-eod
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Gate the daylight/standard cron
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IS_DST=$(python -c "from src.config.market_clock import is_us_dst_active; print('true' if is_us_dst_active() else 'false')")
          case "${{ github.event.schedule }}" in
            "15 20 * * 1-5") REQUIRES_DST="true" ;;
            "15 21 * * 1-5") REQUIRES_DST="false" ;;
            *) REQUIRES_DST="invalid" ;;
          esac
          if [ "$REQUIRES_DST" = "$IS_DST" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run EOD scan
        if: steps.gate.outputs.skip == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.runners.run_signal_scan_eod
      - if: always()
        uses: ./.github/actions/commit-state
