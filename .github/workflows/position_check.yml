name: Position Management Check

on:
  schedule:
    - cron: '0 22 * * 1-5'  # 美股收盤後 22:00 UTC
  workflow_dispatch:

concurrency:
  group: position-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run position check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSITION_MODE: mode_1
          PRIVATE_POSITION_CONTEXT: '1'
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
          POSITION_STATE_KEY: ${{ secrets.POSITION_STATE_KEY }}
        run: python -m src.runners.run_position_check
      - if: always()
        uses: ./.github/actions/commit-state
