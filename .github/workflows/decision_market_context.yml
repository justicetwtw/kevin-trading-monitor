name: Decision Market Context

on:
  schedule:
    # 06:20 Asia/Taipei: after both U.S. daylight (04:00) and standard (05:00) closes.
    - cron: '20 6 * * 2-6'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decision-market-context
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet -r requirements.txt
      - name: Refresh market context (capture status)
        id: refresh
        shell: bash
        run: |
          set +e
          python -m src.runners.run_decision_market_context
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit public-safe state
        shell: bash
        run: |
          set -euo pipefail
          path='data_store/decision_market_context.json'
          [ -f "$path" ] || { echo 'safe state missing'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git diff --cached --quiet && exit 0
          git commit -m 'state: decision market context [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
      - name: Enforce source health
        if: always()
        env:
          REFRESH_STATUS: ${{ steps.refresh.outputs.status }}
        run: |
          [ "$REFRESH_STATUS" = '0' ] || { echo "decision market context degraded (status=$REFRESH_STATUS)"; exit 1; }
